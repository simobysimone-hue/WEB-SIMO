# Web SIMO en Netlify: páginas estáticas en la raíz + funciones de reservas (Stripe y correo).
[build]
  command = "npm install --no-audit --no-fund --omit=dev"
  publish = "."
  functions = "netlify/functions"

# El correo de contacto sale a propósito en la web, así que no se trata como secreto.
# La contraseña del correo, la de admin y la clave de Stripe se siguen vigilando.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GMAIL_USER"

[functions]
  node_bundler = "esbuild"

# Rutas cortas
[[redirects]]
  from = "/talleres"
  to = "/talleres.html"
  status = 200

[[redirects]]
  from = "/bolsos"
  to = "/bolsos.html"
  status = 200

# No publicar archivos internos
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# Direcciones de la web antigua de talleres (simo-landing) → web nueva
[[redirects]]
  from = "/aviso-legal"
  to = "/index.html#aviso-legal"
  status = 301
[[redirects]]
  from = "/aviso-legal.html"
  to = "/index.html#aviso-legal"
  status = 301
[[redirects]]
  from = "/privacidad"
  to = "/index.html#privacidad"
  status = 301
[[redirects]]
  from = "/privacidad.html"
  to = "/index.html#privacidad"
  status = 301
[[redirects]]
  from = "/cookies"
  to = "/index.html#cookies"
  status = 301
[[redirects]]
  from = "/cookies.html"
  to = "/index.html#cookies"
  status = 301
