<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SIMO · Tu carrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
body{margin:0;background:#F6F5F3;color:#111;font-family:Poppins,system-ui,sans-serif;font-size:16px;line-height:1.55}
a{color:inherit;text-decoration:none}
.win-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px 28px;background:#F6F5F3;padding:12px 28px;border-bottom:1px solid #E2DED6}
.win-bar img{height:40px;display:block}
.win-bar nav{margin-left:auto;display:flex;gap:22px;font-family:Caveat,cursive;font-size:24px;line-height:1}
main{max-width:1120px;margin:0 auto;padding:28px 28px 56px;box-sizing:border-box}
.tag{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#5E1727;font-weight:600;margin:0}
h1{font-family:Impact,"Arial Black",sans-serif;font-weight:400;font-size:46px;letter-spacing:.5px;line-height:1;margin:6px 0 22px;color:#5E1727}
h1 em{font-family:Caveat,cursive;font-style:normal;font-weight:700;color:#0B0B0C}
h2{font-family:Impact,"Arial Black",sans-serif;font-weight:400;font-size:26px;letter-spacing:.5px;margin:0 0 12px}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
.caja{background:#fff;border:1px solid #111;border-radius:6px;padding:20px}
.item{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid #E2DED6}
.item:first-of-type{padding-top:0}
.item:last-of-type{border-bottom:0}
.mini{background:radial-gradient(ellipse at 50% 40%,#fbfaf8 0%,#ECE8E1 100%);border-radius:6px;overflow:hidden;aspect-ratio:1.1}
.mini svg{display:block;width:100%;height:100%}
.item h3{font-size:16px;margin:0}
.item ul{list-style:none;margin:6px 0;padding:0;font-size:13px;color:#555}
.item .nota{font-size:12px;color:#555;font-style:italic;margin:4px 0}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.cant{display:flex;align-items:center;gap:6px}
.cant button,.quitar{border:1px solid #111;border-radius:6px;background:#fff;cursor:pointer;font:600 14px Poppins,system-ui,sans-serif}
.cant button{width:32px;height:32px}
.cant span{min-width:20px;text-align:center;font-weight:600}
.quitar{padding:6px 10px;font-size:12px}
.precio{font-family:Impact,"Arial Black",sans-serif;font-size:22px}
.vacio{text-align:center;padding:30px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border:2px solid #111;border-radius:6px;background:#111;color:#F6F5F3;font:600 13px Poppins,system-ui,sans-serif;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
.btn:hover{background:#5E1727;border-color:#5E1727}
.btn.linea{background:transparent;color:#111}
.btn.pagar{width:100%;padding:18px;font-size:14px;background:#5E1727;border-color:#5E1727}
.btn.pagar:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600}
.form input,.form select,.form textarea{border:1px solid #111;border-radius:6px;padding:10px;font:14px Poppins,system-ui,sans-serif;background:#fff}
.form .full{grid-column:1/-1}
.check{flex-direction:row!important;gap:8px;align-items:flex-start;font-weight:400!important;font-size:13px!important}
.check input{margin-top:3px}
.totales{list-style:none;margin:16px 0;padding:12px 0 0;border-top:1px solid #E2DED6;font-size:14px}
.totales li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.totales .total{font-family:Impact,"Arial Black",sans-serif;font-size:30px;padding-top:8px}
.aviso{background:#0B0B0C;color:#F6F5F3;border-radius:6px;padding:10px 14px;font-size:13px;margin:12px 0 0}
.pequeno{font-size:12px;color:#555;margin:10px 0 0}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
@media (max-width:480px){.win-bar{padding:10px 16px}.win-bar img{height:32px}.win-bar nav{gap:12px;font-size:20px}main{padding:20px 16px 48px}h1{font-size:36px}.item{grid-template-columns:96px 1fr;gap:12px}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="win-bar"><a href="index.html" aria-label="SIMO, inicio"><img src="brand/logo-negro.png" alt="SIMO"></a><nav><a href="bolsos.html">Bolsos</a><a href="talleres.html">Talleres</a><a href="index.html#contacto">Contacto</a></nav></div>
<main>
<p class="tag">SIMO · Bolsos por encargo</p>
<h1>Tu <em>carrito</em></h1>
<div class="cols">
<section class="caja" aria-label="Bolsos del carrito">
<h2>Tus bolsos</h2>
<div id="lista"></div>
<div class="vacio" id="vacio" hidden><p>Tu carrito está vacío.</p><a class="btn" href="bolsos.html#disena">Diseñar un bolso</a></div>
<p id="otro" hidden><a class="btn linea" href="bolsos.html#disena">+ Diseñar otro bolso</a></p>
</section>
<section class="caja" id="pago" aria-label="Envío y pago">
<h2>Envío y pago</h2>
<form class="form" id="form" novalidate>
<label class="full">Nombre y apellidos<input name="nombre" autocomplete="name" required></label>
<label>Email<input name="email" type="email" autocomplete="email" required></label>
<label>Teléfono (para el mensajero)<input name="telefono" type="tel" autocomplete="tel" required></label>
<label class="full">País<select name="pais" id="pais" autocomplete="country" required></select></label>
<label class="full">Dirección (calle, número, piso)<input name="direccion" autocomplete="address-line1" required></label>
<label>Código postal<input name="cp" id="cp" autocomplete="postal-code" required></label>
<label>Ciudad<input name="ciudad" autocomplete="address-level2" required></label>
<label class="full">Provincia o región<input name="provincia" autocomplete="address-level1"></label>
<label class="full check"><input type="checkbox" name="acepto" required><span>Entiendo que son bolsos a medida: se hacen en 2 o 3 semanas y, por estar hechos a medida, no se pueden devolver por desistimiento. He leído las <a href="index.html#condiciones" style="text-decoration:underline">condiciones de compra</a>.</span></label>
</form>
<ul class="totales" id="totales"></ul>
<button type="button" class="btn pagar" id="pagar">Pagar el pedido</button>
<p class="aviso" id="aviso" hidden></p>
<p class="pequeno">Pago seguro con tarjeta a través de Stripe. Recibirás la confirmación por email.</p>
</section>
</div>
</main>
<script type="module" src="carrito.js?v=20261124a"></script>
</body>
</html>
