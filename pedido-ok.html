<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SIMO · ¡Pedido confirmado!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F3;color:#111;font-family:Poppins,system-ui,sans-serif;font-size:17px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid #E2DED6}
header img{height:40px;display:block}
header nav{display:flex;gap:22px;font-family:Caveat,cursive;font-size:24px;line-height:1}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;text-align:center}
.box{max-width:560px}
.tag{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#5E1727;font-weight:600;margin:0}
h1{font-family:Impact,"Arial Black",sans-serif;font-weight:400;font-size:64px;line-height:1;letter-spacing:.5px;color:#5E1727;margin:12px 0 0}
h1 em{font-family:Caveat,cursive;font-style:normal;font-weight:700;color:#0B0B0C}
p{font-size:15px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-block;padding:14px 26px;border:2px solid #111;border-radius:6px;background:#111;color:#F6F5F3;font:600 13px Poppins,system-ui,sans-serif;text-transform:uppercase;letter-spacing:1px}
.btn:hover{background:#5E1727;border-color:#5E1727}
.btn-line{background:transparent;color:#111}
@media (max-width:480px){h1{font-size:46px}header{padding:10px 16px}header nav{gap:12px;font-size:20px}header img{height:32px}}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="961b1e2b-0403-421f-922b-cc89f5d497ac" data-domains="simoby.netlify.app"></script>
<script defer src="seguimiento.js?v=20261123"></script>
</head>
<body>
<header><a href="index.html"><img src="brand/logo-negro.png" alt="SIMO"></a><nav><a href="bolsos.html">Bolsos</a><a href="talleres.html">Talleres</a><a href="index.html#contacto">Contacto</a></nav></header>
<main><div class="box">
<p class="tag">Pago recibido</p>
<h1>¡Pedido <em>confirmado!</em></h1>
<p>Gracias por tu pedido. Te hemos enviado la confirmación por email. Cada bolso se hace a mano: tardaremos de 3 a 7 días y te avisaremos cuando salga hacia tu casa.</p>
<div class="btns"><a class="btn" href="bolsos.html">Volver a Bolsos</a><a class="btn btn-line" href="https://www.instagram.com/simo.bysimone/" target="_blank" rel="noopener">Ver Instagram</a></div>
</div></main>
<script>
// El pedido ya está pagado: se cuenta la compra en las estadísticas y se vacía el carrito de este navegador.
const idSesion = new URLSearchParams(location.search).get('sesion');
if (idSesion) {
  let unidades = 0;
  try {
    unidades = (JSON.parse(localStorage.getItem('simo-carrito')) || []).reduce((s, it) => s + (Number(it.cantidad) || 0), 0);
    localStorage.removeItem('simo-carrito');
  } catch (e) {}
  // seguimiento.js se carga con «defer»: se espera a que esté listo.
  document.addEventListener('DOMContentLoaded', () => {
    fetch('/api/confirmar?id=' + encodeURIComponent(idSesion))
      .then(r => r.json())
      .then(d => { if (window.simoCompra) window.simoCompra(idSesion, { ...d, modalidad: 'bolsos', taller: 'Bolsos SIMO', personas: unidades }); })
      .catch(() => {});
  });
}
</script>
</body>
</html>
